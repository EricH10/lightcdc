[workspace]
members = [
    "crates/lightcdc-core",
    "crates/lightcdc-postgres",
    "crates/lightcdc-storage",
    "crates/lightcdc-runtime",
    "crates/lightcdc-api",
    "crates/lightcdc-cli",
    "connectors/lightcdc-redis",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EricH10/lightcdc"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
redb = "4.1"
redis = { version = "1.5", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
rustls = { version = "0.23", features = ["ring"] }
hdrhistogram = "7"
fs2 = "0.4"
flume = { version = "0.12", default-features = false, features = ["async"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", features = ["native-certs", "ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
