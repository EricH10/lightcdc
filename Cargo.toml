[workspace]
members = [
    "crates/lightcdc-core",
    "crates/lightcdc-postgres",
    "crates/lightcdc-storage",
    "crates/lightcdc-runtime",
    "crates/lightcdc-api",
    "crates/lightcdc-cli",
    "connectors/lightcdc-redis",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hendy/lightcdc"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4.1"
redis = { version = "1.5", default-features = false, features = ["connection-manager", "script", "tokio-rustls-comp"] }
hdrhistogram = "7"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-stream = "0.1"
toml = "1"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
