[source]
name = "benchmark"
host = "localhost"
port = 5432
database = "lightcdc"
user = "lightcdc"
password = "lightcdc"
publication = "lightcdc_publication"
slot = "lightcdc_benchmark_slot"

[runtime]
data_dir = "bench/.data"
storage_file = "benchmark.redb"
channel_capacity = 1024
shutdown_timeout_ms = 10000
transaction_memory_threshold_bytes = 16777216
max_transaction_bytes = 1073741824
max_transaction_events = 1000000

[logging]
level = "info"

[[streams]]
name = "benchmark"
source = "benchmark"
tables = ["public.lightcdc_benchmark_events"]
