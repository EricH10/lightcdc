[source]
type = "mysql"
name = "mysql-local"
host = "localhost"
port = 3306
database = "lightcdc"
user = "lightcdc"
password = "lightcdc"
server_id = 5401

[runtime]
data_dir = "data/mysql"
storage_file = "lightcdc.redb"
channel_capacity = 1024
shutdown_timeout_ms = 10000

[logging]
level = "info"

[[streams]]
name = "orders"
source = "mysql-local"
tables = ["lightcdc.orders"]

[[streams]]
name = "all"
source = "mysql-local"
tables = ["*"]
