name: CI

on:
  pull_request:
  push:
    branches: [main, feat/production-readiness]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --locked

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: docker compose up --detach --wait postgres redis
      - run: cargo test -p lightcdc-cli --test capture_integration --locked -- --ignored --test-threads=1
      - run: cargo test -p lightcdc-redis --locked -- --ignored --test-threads=1
      - if: always()
        run: docker compose logs postgres redis
      - if: always()
        run: docker compose down --volumes

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: lightcdc:ci
      - run: docker run --rm lightcdc:ci --version
      - run: test "$(docker run --rm --entrypoint id lightcdc:ci -u)" = "10001"
